<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  @page { size: var(--pw) var(--ph); margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', 'Helvetica', sans-serif; color: #2f3a40; }
  .page { width: var(--pw); height: var(--ph); padding: 0.45in 0.5in; display: flex; flex-direction: column; page-break-after: always; }
  .page:last-child { page-break-after: auto; }
  header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 0.18in; }
  h1 { font-size: 34pt; font-weight: 800; letter-spacing: -0.5pt; line-height: 1; }
  h1 span { color: var(--accent); }
  .week { font-size: 12pt; font-weight: 600; }
  .week i { display: inline-block; width: 2in; border-bottom: 1.5pt solid currentColor; margin-left: 6pt; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; flex: 1; table-layout: fixed; }
  th { font-size: 11pt; font-weight: 800; padding: 6pt 0; color: #fff; background: var(--head); }
  th:first-child { border-top-left-radius: 10pt; } th:last-child { border-top-right-radius: 10pt; }
  th.who, th.chore { text-align: left; padding-left: 10pt; }
  col.who { width: 17%; } col.chore { width: 30%; }
  td { border-bottom: 1pt solid var(--line); border-right: 1pt solid var(--line); }
  td:first-child { border-left: 1pt solid var(--line); }
  tr:nth-child(even) td { background: var(--band); }
  tr:last-child td:first-child { border-bottom-left-radius: 10pt; }
  tr:last-child td:last-child { border-bottom-right-radius: 10pt; }
  td.box { text-align: center; }
  td.box b { display: inline-block; width: 0.26in; height: 0.26in; border: 1.5pt solid var(--box); border-radius: 50%; background: #fff; }
  footer { display: grid; grid-template-columns: 1fr 1fr; gap: 0.25in; margin-top: 0.2in; }
  .note { border: 1.5pt dashed var(--box); border-radius: 10pt; padding: 8pt 12pt; height: 0.85in; font-weight: 800; font-size: 11pt; color: var(--accent); }
  .note small { display: block; font-weight: 400; font-size: 8.5pt; color: #6b777d; }
</style></head>
<body>
<div class="page">
  <header>
    <h1>Our Weekly <span>Chores</span></h1>
    <div class="week">Week of<i></i></div>
  </header>
  <table>
    <colgroup><col class="who"><col class="chore"><col><col><col><col><col><col><col></colgroup>
    <thead><tr><th class="who">Who</th><th class="chore">Chore</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th><th>Sun</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <footer>
    <div class="note">This week's goal<small>What are we working towards together?</small></div>
    <div class="note">Reward when we finish<small>Movie night, a park trip, pick dinner…</small></div>
  </footer>
</div>
<script>
  let r=''; for(let i=0;i<12;i++){ r+='<tr><td></td><td></td>'+'<td class="box"><b></b></td>'.repeat(7)+'</tr>'; }
  document.getElementById('rows').innerHTML=r;
</script>
</body></html>
