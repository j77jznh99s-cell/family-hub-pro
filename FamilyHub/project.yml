# Generate the Xcode project with: brew install xcodegen && xcodegen
# Before running on your phone, change the three settings under `settings.base` below to your own values.
name: FamilyHub
options:
  bundleIdPrefix: com.familyhub
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # 1. Your Apple Developer Team ID (Xcode → Settings → Accounts, or developer.apple.com → Membership).
    DEVELOPMENT_TEAM: ""
    # 2. Must be unique to you — e.g. com.yourname.familyhub
    APP_BUNDLE_ID: com.familyhub.app
    # 3. Must start with "group." and be unique to you — e.g. group.com.yourname.familyhub
    APP_GROUP_ID: group.com.familyhub.shared
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic

packages:
  FamilyHubCore:
    path: Packages/FamilyHubCore

targets:
  FamilyHub:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: FamilyHubCore
      - target: FamilyHubWidget
      - sdk: MessageUI.framework
      - sdk: ContactsUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: App/FamilyHub.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Family Hub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FHAppGroupID: $(APP_GROUP_ID)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSContactsUsageDescription: Pick the people you want to stay in touch with.
        NSCalendarsFullAccessUsageDescription: Family Hub reads upcoming event titles so conversation starters can mention what's going on in your week. Nothing is changed on your calendar.
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID)
            CFBundleURLSchemes: [familyhub]

  FamilyHubWidget:
    type: app-extension
    platform: iOS
    sources: [Widget]
    dependencies:
      - package: FamilyHubCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: Widget/FamilyHubWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Family Hub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FHAppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  FamilyHub:
    build:
      targets:
        FamilyHub: all
        FamilyHubWidget: all
    run:
      config: Debug
    archive:
      config: Release
